<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Password Generator</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Password Generator</h1>
    <div class="password-display">
      <p id="passwordOutput">Your password will appear here</p>
    </div>
    
    <div class="settings">
      <div class="setting-item-column">
        <label>Password Length: <span id="lengthValue">12</span></label>
        <input type="range" id="lengthSlider" min="4" max="32" value="12">
      </div>
      <div class="setting-item">
        <label for="includeUppercase">Include Uppercase</label>
        <input type="checkbox" id="includeUppercase" checked>
      </div>
      <div class="setting-item">
        <label for="includeLowercase">Include Lowercase</label>
        <input type="checkbox" id="includeLowercase" checked>
      </div>
      <div class="setting-item">
        <label for="includeNumbers">Include Numbers</label>
        <input type="checkbox" id="includeNumbers" checked>
      </div>
      <div class="setting-item">
        <label for="includeSymbols">Include Symbols</label>
        <input type="checkbox" id="includeSymbols" checked>
      </div>
    </div>

    <div class="controls">
      <button id="generateBtn" class="primary-btn">Generate Password</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
