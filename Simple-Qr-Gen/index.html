<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <main class="generator">
            <h1>QR Code Generator</h1>
            
            <div class="input-section">
                <input 
                    type="text" 
                    id="qrInput" 
                    placeholder="Enter text or URL"
                    class="input-field"
                >
                <button id="generateBtn" class="btn-generate">Generate QR Code</button>
            </div>

            <div id="result" class="result-section hidden">
                <div class="qr-display">
                    <img id="qrImage" src="" alt="Generated QR Code">
                </div>
                <div class="button-group">
                    <button id="downloadBtn" class="btn-download">Download QR Code</button>
                    <button id="clearBtn" class="btn-clear">Clear</button>
                </div>
            </div>

            <div id="error" class="error-message hidden"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
